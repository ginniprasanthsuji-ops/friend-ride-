name: TASKO Laundry Main Integration Regression

on:
  push:
    branches:
      - integration/tasko-laundry-main-safe
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'tests/tasko-laundry-main-regression.spec.js'
      - '.github/workflows/tasko-laundry-main-regression.yml'

jobs:
  playwright-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 4173 --directory . > /tmp/friendride-http.log 2>&1 &
          echo $! > /tmp/friendride-http.pid
      - name: Wait for app
        run: |
          for i in {1..30}; do
            curl --fail http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/friendride-http.log
          exit 1
      - name: Run TASKO / Laundry / Admin Playwright tests
        run: npx playwright test tests/tasko-laundry-main-regression.spec.js --reporter=line
