name: FRIEND RIDE YF15 Preview Deploy

on:
  push:
    branches:
      - yf-test-1-to-15

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-yf15-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout YF 1-15 source
        uses: actions/checkout@v4
        with:
          ref: yf-test-1-to-15
          path: yf15

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage active YF15 app at Pages root
        run: |
          mkdir -p site
          rsync -a --exclude='.git' --exclude='.github' yf15/ site/
          test -f site/index.html

      - name: Upload YF15 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: yf15-pages
          path: site/

      - name: Deploy isolated YF15 preview
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: yf15-pages
