<!-- ROAD RIDE STATION Guest Driver Profile UI fragment. Insert into the feature page section. -->
<section id="roadRideGuestProfile" class="card">
 <h2>🏍️ ROAD RIDE STATION</h2>
 <p class="muted">Guest Driver Registration • మీ ప్రయాణాన్ని Rideగా publish చేయండి</p>
 <div id="rrGuestStatus" class="notice">Guest session start చేయండి లేదా existing session ఉపయోగించండి.</div>
 <button class="btn purple" type="button" onclick="rrStartGuest()">Continue as Guest Driver</button>
 <div class="field"><label>Driver Name</label><input id="rrName" maxlength="80" placeholder="మీ పేరు"></div>
 <div class="field"><label>Phone Number (10 digits)</label><input id="rrPhone" inputmode="numeric" maxlength="10" placeholder="Mobile number"></div>
 <div class="field"><label>Bike Registration Number</label><input id="rrBikeNo" maxlength="20" placeholder="AP / TS / ..."></div>
 <div class="field"><label>Driver Photo (Camera / Gallery)</label><input id="rrPhoto" type="file" accept="image/jpeg,image/png,image/webp" capture="user" onchange="rrPreviewPhoto(this)"></div>
 <div id="rrPhotoPreviewWrap" class="hide" style="text-align:center"><img id="rrPhotoPreview" alt="Driver photo preview" style="width:110px;height:110px;object-fit:cover;border-radius:50%;border:3px solid #5420b8"></div>
 <button class="btn" type="button" onclick="rrValidateProfile()">Save Guest Driver Profile (Local Validation)</button>
 <small class="muted">Phone OTP verification is not connected yet. Phone verification status will remain unverified until OTP is implemented.</small>
</section>
