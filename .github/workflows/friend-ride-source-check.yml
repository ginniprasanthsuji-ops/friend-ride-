name: FRIEND RIDE source checks
on:
  push:
    branches: [yf-workflow-fix-nov08]
  pull_request:
    branches: [main]
jobs:
  inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-inline-js.mjs
