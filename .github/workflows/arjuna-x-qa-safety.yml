name: ARJUNA X QA Safety Unit Checks
on:
  push:
    branches:
      - arjuna-x/phase-7-ai-intelligence-safety
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run dependency-free preflight safety tests
        run: node --test tests/qa-preflight-safety.test.cjs
      - name: Run ARJUNA X Phase 8 voice intent contract tests
        run: node --test tests/voice-intent-contract.test.cjs
      - name: Run ARJUNA X Phase 9 runtime policy tests
        run: node --test tests/phase-9-runtime-policy.test.cjs
      - name: Run ARJUNA X Phase 9 runtime lifecycle tests
        run: node --test tests/phase-9-runtime-lifecycle.test.cjs
      - name: Run ARJUNA X Phase 9 retry policy tests
        run: node --test tests/phase-9-retry-policy.test.cjs
      - name: Run ARJUNA X Phase 9 recovery policy tests
        run: node --test tests/phase-9-recovery-policy.test.cjs
