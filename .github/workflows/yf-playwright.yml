name: YF Playwright Regression and E2E
on:
  push:
    branches: [yf-test-1-to-15]
  pull_request:
    branches: [yf-test-1-to-15]
jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Phase 13D ERS/RRS cash-only static QA
        run: node tests/phase13d-ers-rrs-cash-static.test.cjs
      - name: Run E2E and regression tests
        run: npx playwright test
      - name: Upload Playwright report and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yf-playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
