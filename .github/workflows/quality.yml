name: FRIEND RIDE Quality Gate
on:
  push:
    branches: [main, arjuna-x/phase-2-repository-assets-inventory]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main]
jobs:
  typecheck-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture dependency audit report (non-blocking while remediation is pending)
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const r=JSON.parse(require('fs').readFileSync('npm-audit.json','utf8')); const v=r.metadata?.vulnerabilities||{}; console.log('npm audit totals:', JSON.stringify(v)); console.log('Advisory report saved as npm-audit.json artifact for review.')"
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-dependency-audit
          path: npm-audit.json
          if-no-files-found: ignore
      - run: npm run typecheck
      - run: npm run typecheck:core
      - run: npm run build:runtime
      - run: npm run test:unit
      - run: npm run test:core

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          python3 -m http.server 4173 --directory . >/tmp/friend-ride-http.log 2>&1 &
          echo $! >/tmp/friend-ride-http.pid
          sleep 2
      - name: Run browser regression suite
        env:
          FRIEND_RIDE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test
