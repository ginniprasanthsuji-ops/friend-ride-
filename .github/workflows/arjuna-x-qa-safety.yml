name: ARJUNA X QA Safety Unit Checks
on:
  push:
    branches:
      - arjuna-x/phase-7-ai-intelligence-safety
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run dependency-free preflight safety tests
        run: node --test tests/qa-preflight-safety.test.cjs
