name: FRIEND RIDE QA Preview Deployment

on:
  push:
    branches:
      - phase14-qa-live-preview
    paths:
      - index.html
      - manifest.webmanifest
      - sw.js
      - assets/**
      - learn-teach.js
      - .github/workflows/friend-ride-qa-preview-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: friend-ride-qa-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA preview branch
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy QA preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
