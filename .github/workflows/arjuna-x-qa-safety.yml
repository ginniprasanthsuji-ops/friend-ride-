name: ARJUNA X QA Safety Unit Checks
on:
  push:
    branches:
      - arjuna-x/phase-7-ai-intelligence-safety
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run dependency-free preflight safety tests
        run: node --test tests/qa-preflight-safety.test.cjs
      - name: Run ARJUNA X Phase 8 voice intent contract tests
        run: node --test tests/voice-intent-contract.test.cjs
      - name: Run ARJUNA X Phase 9 runtime policy tests
        run: node --test tests/phase-9-runtime-policy.test.cjs
      - name: Run ARJUNA X Phase 9 runtime lifecycle tests
        run: node --test tests/phase-9-runtime-lifecycle.test.cjs
      - name: Run ARJUNA X Phase 9 retry policy tests
        run: node --test tests/phase-9-retry-policy.test.cjs
      - name: Run ARJUNA X Phase 9 recovery policy tests
        run: node --test tests/phase-9-recovery-policy.test.cjs
      - name: Run ARJUNA X Phase 9 diagnostics context tests
        run: node --test tests/phase-9-diagnostics-context.test.cjs
      - name: Run ARJUNA X Phase 9 runtime integration tests
        run: node --test tests/phase-9-runtime-integration.test.cjs
      - name: Run ARJUNA X Phase 9 architecture safety audit
        run: node --test tests/phase-9-architecture-safety.test.cjs
      - name: Run ARJUNA X bike warning event-guard regression tests
        run: node --test tests/arjuna-x-bike-speed-warning-event-guard-*.test.cjs
      - name: Run ARJUNA X Phase 10 mocked integration validation
        run: node --test tests/phase-10-mocked-integration-validation.test.cjs
      - name: Run ARJUNA X bike speed warning policy tests
        run: node --test tests/arjuna-x-bike-speed-warning.test.cjs tests/arjuna-x-bike-speed-warning-gps-cooldown-edge-batch.test.cjs tests/arjuna-x-bike-speed-warning-policy-precedence-isolation-batch.test.cjs tests/arjuna-x-bike-speed-warning-malformed-numeric-input-batch.test.cjs tests/arjuna-x-bike-speed-warning-nonbike-malformed-isolation-batch.test.cjs tests/arjuna-x-bike-speed-warning-phase-10-final-safety-audit-matrix.test.cjs tests/arjuna-x-bike-speed-warning-final-timestamp-audit.test.cjs
      - name: Run ARJUNA X helmet verification policy tests
        run: node --test tests/arjuna-x-helmet-verification.test.cjs
