name: FRIEND RIDE Quality Gate
permissions:
  contents: read
on:
  push:
    branches: [main, arjuna-x/phase-2-repository-assets-inventory]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main]
jobs:
  dependency-lockfile-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate lockfile candidate without package scripts
        run: npm install --package-lock-only --ignore-scripts --audit=false
      - name: Capture audit for candidate dependency graph
        run: npm audit --json > npm-audit-lockfile-preview.json || true
      - name: Record lockfile preview metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const summary = process.env.GITHUB_STEP_SUMMARY;
          const lines = [
            '### Dependency lockfile preview',
            '',
            '- Candidate package-lock.json generated by npm in isolated CI.',
            '- Package lifecycle scripts were disabled for generation.',
            '- This artifact is **not committed or accepted** until reviewed.',
            '- npm audit JSON for this candidate is included in the artifact.',
            '',
            'Lockfile version: ' + (lock.lockfileVersion ?? 'unknown'),
            'Locked package entries: ' + Object.keys(lock.packages || {}).length,
            ''
          ].join('\n');
          if (summary) fs.appendFileSync(summary, lines);
          console.log(lines);
          NODE
      - name: Upload candidate lockfile and audit JSON for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-lockfile-preview-${{ github.sha }}
          path: |
            package-lock.json
            npm-audit-lockfile-preview.json
          if-no-files-found: warn
          retention-days: 7
  typecheck-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Capture dependency audit report (non-blocking while remediation is pending)
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          try {
            const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
            console.log('npm audit totals:', report.metadata?.vulnerabilities ?? 'summary missing');
            console.log('Detailed advisory report is available in the artifact.');
          } catch (error) {
            console.log('Audit report could not be parsed; preserve the raw artifact for investigation.');
          }
          NODE
      - name: Summarize npm audit advisories in job summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          const nl = String.fromCharCode(10);
          const backslash = String.fromCharCode(92);
          const escapeCell = value => String(value ?? '').replaceAll(backslash, backslash + backslash).replaceAll('|', backslash + '|').replaceAll(String.fromCharCode(10), ' ').replaceAll(String.fromCharCode(13), ' ').replaceAll('[', backslash + '[').replaceAll(']', backslash + ']').replaceAll('`', backslash + '`').replaceAll('*', backslash + '*').replaceAll('_', backslash + '_');
          const fixLabel = fix => fix === false ? 'No fix reported' : fix === true ? 'Fix available' : fix && typeof fix === 'object' ? (fix.version ? `Version ${fix.version}` : 'Fix available') : 'Unknown';
          const rank = {critical:0, high:1, moderate:2, low:3, info:4};
          try {
            const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
            const counts = report.metadata?.vulnerabilities || {};
            const rows = Object.entries(report.vulnerabilities || {}).map(([name, item]) => {
              const via = Array.isArray(item.via) ? item.via : [];
              const advisories = via.filter(v => v && typeof v === 'object');
              const fallbackTitle = advisories.map(v => v.title || v.name).filter(Boolean).join('; ') || (via.length ? via.map(String).join('; ') : 'No advisory title');
              const links = advisories.filter(v => typeof v.url === 'string' && v.url.startsWith('https://'));
              const title = links.length
                ? links.slice(0, 2).map(v => `${escapeCell(v.title || v.name || 'Advisory')} — ${escapeCell(v.url)}`).join('; ')
                : escapeCell(fallbackTitle);
              return {severity:item.severity||'unknown',name,direct:item.isDirect?'direct':'transitive',range:item.range||'—',fix:fixLabel(item.fixAvailable),title};
            }).sort((a,b) => (rank[a.severity] ?? 5) - (rank[b.severity] ?? 5));
            let md = `### npm audit advisory summary${nl}${nl}`;
            md += `Counts: ${escapeCell(counts.critical||0)} critical · ${escapeCell(counts.high||0)} high · ${escapeCell(counts.moderate||0)} moderate · ${escapeCell(counts.low||0)} low · ${escapeCell(counts.total||0)} total${nl}${nl}`;
            if (rows.length) {
              md += `| Package | Severity | Direct/transitive | Vulnerable range | Fix | Advisory |${nl}|---|---|---|---|---|---|${nl}`;
              for (const row of rows) md += `|${escapeCell(row.name)}|${escapeCell(row.severity)}|${escapeCell(row.direct)}|${escapeCell(row.range)}|${escapeCell(row.fix)}|${row.title}|${nl}`;
            } else md += `No package-level vulnerability entries were found in the parsed report.${nl}`;
            if (summaryPath) fs.appendFileSync(summaryPath, md);
            console.log(md);
          } catch (error) {
            const msg = 'npm audit JSON was missing or could not be parsed; preserve the raw artifact and inspect the step log.';
            if (summaryPath) fs.appendFileSync(summaryPath, `### npm audit advisory summary${nl}${nl}${msg}${nl}`);
            console.log(msg);
          }
          NODE
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-dependency-audit
          path: npm-audit.json
          if-no-files-found: ignore
      - run: npm run typecheck
      - run: npm run typecheck:core
      - run: npm run build:runtime
      - run: npm run test:unit
      - run: npm run test:core

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          python3 -m http.server 4173 --directory . >/tmp/friend-ride-http.log 2>&1 &
          echo $! >/tmp/friend-ride-http.pid
          sleep 2
      - name: Run browser regression suite
        env:
          FRIEND_RIDE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test
