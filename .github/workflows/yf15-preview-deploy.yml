name: FRIEND RIDE YF15 Preview Deploy

on:
  push:
    branches:
      - yf-test-1-to-15

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-yf15-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main production source
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout YF 1-15 preview source
        uses: actions/checkout@v4
        with:
          ref: yf-test-1-to-15
          path: yf15

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage production root and isolated YF15 preview
        run: |
          mkdir -p site/qa-preview-yf15
          rsync -a --exclude='.git' production/ site/
          cp yf15/index.html yf15/manifest.webmanifest yf15/manifest.json yf15/sw.js yf15/service-worker.js yf15/learn-teach.js yf15/learn-teach.css yf15/test.html site/qa-preview-yf15/ 2>/dev/null || true
          for d in assets icons styles; do
            if [ -d "yf15/$d" ]; then cp -R "yf15/$d" site/qa-preview-yf15/; fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy isolated YF15 preview
        id: deployment
        uses: actions/deploy-pages@v4
