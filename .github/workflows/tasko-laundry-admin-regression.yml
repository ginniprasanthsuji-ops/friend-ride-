name: TASKO and Laundry Admin Regression
on:
  push:
    branches:
      - feature/tasko-laundry-services
  pull_request:
    branches:
      - main
      - feature/tasko-laundry-services
jobs:
  playwright-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start static app server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/friendride-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
      - name: Run TASKO and Laundry regression tests
        run: npx playwright test tests/tasko-laundry-admin-regression.spec.js
