name: Generate npm lockfile (QA)
on:
  push:
    branches:
      - qa/phase9-stabilization-2026-11-24
    paths:
      - package.json
      - .github/workflows/qa-generate-lockfile.yml
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/phase9-stabilization-2026-11-24
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and verify lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --package-lock=true
          test -s package-lock.json
          echo "Lockfile generated: $(wc -c < package-lock.json) bytes"
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f package-lock.json
          git commit -m "QA Phase 9: add npm lockfile" || echo "No commit needed"
          git push
