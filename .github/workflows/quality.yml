name: FRIEND RIDE Quality Gate
on:
  push:
    branches: [main, arjuna-x/phase-2-security-closure]
  pull_request:
    branches: [main]
jobs:
  typecheck-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run typecheck:core
      - run: npm run build:runtime
      - run: npm run test:unit
      - run: npm run test:core

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          python3 -m http.server 4173 --directory . >/tmp/friend-ride-http.log 2>&1 &
          echo $! >/tmp/friend-ride-http.pid
          sleep 2
      - name: Run Phase 2/main safe browser suite
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arjuna-x/phase-2-security-closure' || github.head_ref == 'arjuna-x/phase-2-security-closure'
        env:
          FRIEND_RIDE_BASE_URL: http://127.0.0.1:4173
        run: npm run test:phase2
      - name: Run full browser suite (UI migration branches)
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/arjuna-x/phase-2-security-closure' && github.head_ref != 'arjuna-x/phase-2-security-closure'
        env:
          FRIEND_RIDE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test
