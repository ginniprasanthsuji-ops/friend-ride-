name: Arjuna X Python Read-only QA Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/arjuna-x/phase-7-ai-intelligence-safety'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch only
        uses: actions/checkout@v4
        with:
          ref: arjuna-x/phase-7-ai-intelligence-safety
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run read-only audit self-test
        run: python scripts/arjuna_x_readonly_qa_audit.py --self-test
      - name: Run read-only QA audit
        run: python scripts/arjuna_x_readonly_qa_audit.py
