<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="./manifest.json"><title>FRIEND RIDE</title>
<style>
:root{color-scheme:dark;--bg:#101827;--card:#17243a;--line:#2a3b55;--text:#f8fafc;--muted:#cbd5e1;--green:#38e8b4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px Arial}header{padding:18px;text-align:center;background:var(--card)}main{max-width:760px;margin:16px auto;padding:0 12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}h2{color:var(--green);font-size:19px}label{display:block;margin:10px 0 5px;color:var(--muted)}input,select,textarea{width:100%;padding:12px;border-radius:9px;border:1px solid #40516b;background:#0f172a;color:white;font-size:16px}button{border:0;border-radius:9px;padding:12px;background:var(--green);color:#06251f;font-weight:bold;margin:8px 5px 0 0}button.secondary{background:#334155;color:white}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.status{background:#0f172a;padding:10px;border-radius:8px;white-space:pre-wrap;margin-top:10px;color:var(--muted)}.item{border:1px solid var(--line);padding:12px;border-radius:10px;margin:10px 0}.muted{color:var(--muted);font-size:14px}a{color:#8bd5ff;margin:8px;display:inline-block}@media(max-width:520px){.row{grid-template-columns:1fr}}
</style></head><body><header><h1>🚕 FRIEND RIDE</h1><p>Your Ride, Your Choice</p></header><main>
<section id="authCard" class="card"><h2>📱 Mobile OTP Login</h2><label>మొబైల్ నంబర్</label><input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="9876543210"><button id="sendOtpBtn">OTP పంపండి</button><div id="otpArea" class="hidden"><label>SMS OTP</label><input id="otp" inputmode="numeric" maxlength="6"><button id="verifyOtpBtn">OTP ధృవీకరించండి</button></div><div id="authStatus" class="status">మొబైల్ నంబర్ నమోదు చేయండి.</div></section>
<section id="appArea" class="hidden">
<section class="card"><div class="row"><div><h2>FRIEND RIDE</h2><div id="userInfo" class="muted"></div></div><div><button id="enablePushBtn" class="secondary">Notifications ON</button><button id="logoutBtn" class="secondary">Logout</button></div></div>
<label>మీ పేరు</label><input id="fullName" placeholder="పూర్తి పేరు"><div class="row"><div><label>మీరు ఎవరు?</label><select id="role"><option value="customer">Customer</option><option value="driver">Driver</option></select></div><div><label>వాహనం</label><select id="vehicleType"><option>Bike</option><option>Auto</option><option>Car</option></select></div></div><button id="saveProfileBtn">ప్రొఫైల్ సేవ్</button><div id="profileStatus" class="status"></div></section>
<section id="bookingCard" class="card"><h2>🛺 Ride Booking</h2><label>Pickup</label><input id="pickup" placeholder="ఎక్కడి నుంచి?"><label>Drop</label><input id="drop" placeholder="ఎక్కడికి?"><div class="row"><div><label>వాహనం</label><select id="rideVehicle"><option>Bike</option><option>Auto</option><option>Car</option></select></div><div><label>Fare Offer ₹</label><input id="fare" type="number" min="1"></div></div><label>Notes</label><textarea id="notes"></textarea><button id="bookRideBtn">Ride Request చేయండి</button><div id="bookingStatus" class="status"></div></section>
<section id="driverCard" class="card hidden"><h2>🚗 Driver Panel</h2><div id="driverApproval" class="status"></div><button id="onlineBtn">Online</button><button id="offlineBtn" class="secondary">Offline</button><h3>కొత్త Ride Requests</h3><div id="driverRides"></div><h3>Driver Application</h3><label>వాహన కంపెనీ</label><input id="vehicleCompany"><label>మోడల్</label><input id="vehicleModel"><label>రిజిస్ట్రేషన్ నంబర్</label><input id="vehicleRegistration"><label>Driving License నంబర్</label><input id="licenseNumber"><label>అనుభవం (సంవత్సరాలు)</label><input id="experience" type="number" min="0" value="0"><button id="applyDriverBtn">Driver Application సేవ్</button><div id="driverStatus" class="status"></div></section>
<section class="card"><h2>📋 నా Rides</h2><button id="refreshRidesBtn" class="secondary">Refresh</button><div id="myRides"></div></section>
<section id="adminCard" class="card hidden"><h2>🛡️ Admin Dashboard</h2><button id="loadDriversBtn" class="secondary">Driver Applications లోడ్ చేయండి</button><div id="adminStatus" class="status"></div><div id="adminDrivers"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{"use strict";
const URL="https://fglyplxcczdjtfwobtzh.supabase.co",KEY="sb_publishable_P55B8imGKyE4_8HwLRiaQA_EE81kwVz",db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),show=(id,v=true)=>$(id).classList.toggle("hidden",!v),say=(id,t)=>$(id).textContent=t||"";
let user=null,profile=null,phone=null,requestedPhone=null,channel=null,busy=false;
const e164=x=>{x=String(x||"").replace(/\D/g,"");return /^[6-9]\d{9}$/.test(x)?"+91"+x:null},local=x=>{x=String(x||"").replace(/\D/g,"");return x.length===12&&x.startsWith("91")?x.slice(2):x};
const err=e=>e?.message||String(e);
function map(p,d,v){if(!p||!d)return alert("Pickup మరియు Drop అవసరం");let mode=v==="Bike"?"two-wheeler":"driving";window.open("https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(p)+"&destination="+encodeURIComponent(d)+"&travelmode="+mode,"_blank","noopener");}
function mapButton(el,r,label){let b=document.createElement("button");b.className="secondary";b.textContent=label||"Google Maps Route";b.onclick=()=>map(r.pickup,r.drop,r.vehicle_type);el.append(b)}
function link(el,url,text){let a=document.createElement("a");a.href=url;a.textContent=text;if(url.startsWith("https://")){a.target="_blank";a.rel="noopener"}el.append(a)}
async function contact(id){if(!id)return null;try{let r=await db.from("profiles").select("id,full_name,phone,vehicle_company,vehicle_model,vehicle_registration").eq("id",id).maybeSingle();if(r.error)throw r.error;return r.data}catch(e){console.warn("Profile details restricted by RLS:",err(e));return null}}
function stopLive(){if(channel){db.removeChannel(channel);channel=null}}
function live(){stopLive();if(!user||!profile)return;channel=db.channel("ride-live-"+user.id).on("postgres_changes",{event:"*",schema:"public",table:"rides"},p=>{let r=p.new||{},o=p.old||{},mine=[r.customer_id,r.driver_id,o.customer_id,o.driver_id].includes(user.id);loadRides();if(mine&&p.eventType==="UPDATE"&&["accepted","driver_accepted"].includes(r.status)){if(profile.role==="customer"){say("bookingStatus","✅ Driver మీ Ride Accept చేశారు. Driver వివరాలు క్రింద చూడండి.");if("Notification"in window&&Notification.permission==="granted")try{new Notification("FRIEND RIDE",{body:"Driver మీ Ride Accept చేశారు."})}catch(_){}}else say("driverStatus","Ride Accept అయింది. Customer వివరాలు క్రింద చూడండి.")}if(profile.role==="driver"&&p.eventType==="INSERT")say("driverStatus","కొత్త Ride Request వచ్చింది")}).subscribe(s=>{if(s==="CHANNEL_ERROR")console.warn("Realtime error")})}
async function loadProfile(){let r=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();if(r.error)throw r.error;profile=r.data;if(profile){$("fullName").value=profile.full_name||"";$("role").value=profile.role||"customer";$("vehicleType").value=profile.vehicle_type||"Bike";$("vehicleCompany").value=profile.vehicle_company||"";$("vehicleModel").value=profile.vehicle_model||"";$("vehicleRegistration").value=profile.vehicle_registration||"";$("licenseNumber").value=profile.driving_license_number||"";$("experience").value=profile.driving_experience_years||0}
let a=await db.rpc("is_friend_ride_admin"),admin=!a.error&&a.data===true;show("driverCard",profile?.role==="driver"&&!admin);show("bookingCard",profile?.role!=="driver"&&!admin);show("adminCard",admin);if(profile?.role==="driver")say("driverApproval","Approval Status: "+(profile.driver_approval_status||"pending"))}
async function openApp(){await loadProfile();show("authCard",false);show("appArea",true);say("userInfo","Verified mobile: "+local(phone||user.phone));live();await loadRides()}
$("sendOtpBtn").onclick=async()=>{let p=e164($("phone").value);if(!p)return say("authStatus","సరైన 10 అంకెల మొబైల్ నంబర్ నమోదు చేయండి");try{let r=await db.auth.signInWithOtp({phone:p,options:{shouldCreateUser:true}});if(r.error)throw r.error;requestedPhone=p;show("otpArea");say("authStatus","SMS OTP పంపబడింది")}catch(e){say("authStatus","OTP సమస్య: "+err(e))}};
$("verifyOtpBtn").onclick=async()=>{let p=e164($("phone").value),t=$("otp").value.trim();if(!p||!/^\d{6}$/.test(t))return say("authStatus","మొబైల్ నంబర్, 6 అంకెల OTP నమోదు చేయండి");if(requestedPhone&&p!==requestedPhone)return say("authStatus","OTP కోరిన అదే నంబర్ వాడండి");try{let r=await db.auth.verifyOtp({phone:p,token:t,type:"sms"});if(r.error)throw r.error;user=r.data.user;phone=p;await openApp()}catch(e){say("authStatus","Login సమస్య: "+err(e))}};
$("saveProfileBtn").onclick=async()=>{if(!user)return;let row={id:user.id,full_name:$("fullName").value.trim(),phone:phone||user.phone,role:$("role").value,vehicle_type:$("vehicleType").value};if(!row.full_name)return say("profileStatus","మీ పేరు నమోదు చేయండి");try{let r=await db.from("profiles").upsert(row,{onConflict:"id"}).select().single();if(r.error)throw r.error;await loadProfile();live();await loadRides();say("profileStatus","ప్రొఫైల్ సేవ్ అయింది")}catch(e){say("profileStatus","సేవ్ కాలేదు: "+err(e))}};
$("bookRideBtn").onclick=async()=>{let p=$("pickup").value.trim(),d=$("drop").value.trim(),f=Number($("fare").value);if(!p||!d||f<=0)return say("bookingStatus","Pickup, Drop, Fare నమోదు చేయండి");try{let r=await db.from("rides").insert({customer_id:user.id,vehicle_type:$("rideVehicle").value,pickup:p,drop:d,fare_offer:f,notes:$("notes").value.trim(),status:"requested"});if(r.error)throw r.error;say("bookingStatus","Ride Request పంపబడింది. Driver Accept చేసినప్పుడు Status అప్‌డేట్ అవుతుంది");await loadRides()}catch(e){say("bookingStatus","Booking సమస్య: "+err(e))}};
async function loadRides(){if(!user||!profile||busy)return;busy=true;let box=$("myRides");box.replaceChildren();try{let q=db.from("rides").select("*").order("created_at",{ascending:false}).limit(30);if(profile.role==="customer")q=q.eq("customer_id",user.id);else if(profile.role==="driver")q=q.or("status.eq.requested,driver_id.eq."+user.id);let r=await q;if(r.error)throw r.error;for(let ride of(r.data||[])){let it=document.createElement("div");it.className="item";let h=document.createElement("strong");h.textContent=(ride.vehicle_type||"Ride")+" • ₹"+(ride.agreed_fare??ride.fare_offer??"—");let p=document.createElement("p");p.textContent=(ride.pickup||"")+" → "+(ride.drop||"");let s=document.createElement("p");s.className="muted";s.textContent="Status: "+(ride.status||"unknown");it.append(h,p,s);mapButton(it,ride,"📍 Google Maps Point-to-Point");
if(profile.role==="customer"&&ride.driver_id){let d=await contact(ride.driver_id),info=document.createElement("p");info.className="muted";info.textContent=d?"Driver: "+(d.full_name||"పేరు లేదు")+" • Phone: "+local(d.phone)+" • Vehicle: "+[d.vehicle_company,d.vehicle_model,d.vehicle_registration].filter(Boolean).join(" / "):"Driver వివరాలు చదవలేకపోయాం. Supabase profiles RLS అనుమతి తనిఖీ చేయాలి.";it.append(info);if(d?.phone){link(it,"tel:"+local(d.phone),"📞 Driverకు Call");link(it,"https://wa.me/91"+local(d.phone),"WhatsApp")}}
if(profile.role==="driver"&&ride.customer_id){let c=await contact(ride.customer_id);if(c){let i=document.createElement("p");i.className="muted";i.textContent="Customer: "+(c.full_name||"పేరు లేదు")+" • Phone: "+local(c.phone);it.append(i);if(c.phone)link(it,"tel:"+local(c.phone),"📞 Customerకు Call")}}
if(profile.role==="driver"&&ride.status==="requested"&&profile.driver_approval_status==="approved"){let b=document.createElement("button");b.textContent="Accept Ride";b.onclick=()=>accept(ride.id);it.append(b)}box.append(it)}
if(!r.data?.length)box.textContent="ఇప్పటివరకు rides లేవు";if(profile.role==="driver")await loadRequests()
}catch(e){box.textContent="Rides లోడ్ కాలేదు: "+err(e)}finally{busy=false}}
async function accept(id){try{let r=await db.rpc("accept_ride",{p_ride_id:id});if(r.error)throw r.error;say("driverStatus","Ride Accept request పంపబడింది");await loadRides()}catch(e){say("driverStatus","Accept కాలేదు: "+err(e))}}
async function loadRequests(){let box=$("driverRides");box.replaceChildren();if(profile?.driver_approval_status!=="approved"){box.textContent="Admin approval తర్వాత Requests కనిపిస్తాయి";return}try{let r=await db.from("rides").select("*").eq("status","requested").order("created_at",{ascending:false}).limit(30);if(r.error)throw r.error;for(let ride of(r.data||[])){let it=document.createElement("div");it.className="item";let p=document.createElement("p");p.textContent=ride.pickup+" → "+ride.drop+" • Fare ₹"+ride.fare_offer;it.append(p);mapButton(it,ride,"Pickup → Drop మ్యాప్");let c=await contact(ride.customer_id);if(c){let i=document.createElement("p");i.className="muted";i.textContent="Customer: "+(c.full_name||"పేరు లేదు")+" • Phone: "+local(c.phone);it.append(i);if(c.phone)link(it,"tel:"+local(c.phone),"📞 Customerకు Call")}let b=document.createElement("button");b.textContent="Accept Ride";b.onclick=()=>accept(ride.id);it.append(b);box.append(it)}if(!r.data?.length)box.textContent="కొత్త requests లేవు"}catch(e){box.textContent="Requests సమస్య: "+err(e)}}
async function online(v){if(profile?.driver_approval_status!=="approved")return say("driverStatus","Admin approval అవసరం");try{let r=await db.from("driver_locations").upsert({driver_id:user.id,is_online:v,updated_at:new Date().toISOString()},{onConflict:"driver_id"});if(r.error)throw r.error;say("driverStatus",v?"మీరు Onlineలో ఉన్నారు":"మీరు Offlineలో ఉన్నారు")}catch(e){say("driverStatus",err(e))}}
$("onlineBtn").onclick=()=>online(true);$("offlineBtn").onclick=()=>online(false);
$("applyDriverBtn").onclick=async()=>{let row={id:user.id,full_name:$("fullName").value.trim(),phone:phone||user.phone,role:"driver",vehicle_type:$("vehicleType").value,vehicle_company:$("vehicleCompany").value.trim(),vehicle_model:$("vehicleModel").value.trim(),vehicle_registration:$("vehicleRegistration").value.trim(),driving_license_number:$("licenseNumber").value.trim(),driving_experience_years:Number($("experience").value||0),driver_approval_status:profile?.driver_approval_status||"pending"};try{let r=await db.from("profiles").upsert(row,{onConflict:"id"});if(r.error)throw r.error;await loadProfile();say("driverStatus","Application సేవ్ అయింది; Admin approval కోసం వేచి ఉండండి")}catch(e){say("driverStatus","Application సమస్య: "+err(e))}};
$("loadDriversBtn").onclick=async()=>{try{let r=await db.rpc("admin_list_driver_applications");if(r.error)throw r.error;let box=$("adminDrivers");box.replaceChildren();(r.data||[]).forEach(d=>{let it=document.createElement("div");it.className="item";let p=document.createElement("p");p.textContent=(d.full_name||"Driver")+" • "+(d.phone||"")+" • "+(d.driver_approval_status||"pending");it.append(p);if(d.driver_approval_status!=="approved"){let b=document.createElement("button");b.textContent="Approve Driver";b.onclick=async()=>{let a=await db.rpc("admin_approve_driver",{p_driver_id:d.id});if(a.error)say("adminStatus",err(a.error));else{$("loadDriversBtn").click();say("adminStatus","Driver approved")}};it.append(b)}box.append(it)});say("adminStatus",(r.data||[]).length+" applications")}catch(e){say("adminStatus",err(e))}};
$("enablePushBtn").onclick=async()=>{if(!("Notification"in window))return say("profileStatus","ఈ browser Notifications support చేయదు");let p=await Notification.requestPermission();say("profileStatus",p==="granted"?"Browser notification permission వచ్చింది. Background push కోసం server-side VAPID setup ఇంకా అవసరం.":"Notification permission ఇవ్వలేదు")};
$("refreshRidesBtn").onclick=loadRides;
$("logoutBtn").onclick=async()=>{stopLive();await db.auth.signOut();user=null;profile=null;phone=null;show("appArea",false);show("authCard",true);show("otpArea",false);say("authStatus","Logout అయ్యారు")};
async function init(){let r=await db.auth.getSession();if(r.data?.session){user=r.data.session.user;phone=user.phone||null;await openApp()}}db.auth.onAuthStateChange((_e,s)=>{if(s?.user){user=s.user;phone=s.user.phone||phone}});init();
})();
</script><script>if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));</script></body></html>
