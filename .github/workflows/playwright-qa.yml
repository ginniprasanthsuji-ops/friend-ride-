name: FRIEND RIDE QA Playwright Smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/learn-teach-marketplace-qa]
jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright
        run: npx playwright test
