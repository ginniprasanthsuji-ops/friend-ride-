name: Phase 9 Stabilization Regression
on:
  push:
    branches:
      - qa/phase9-stabilization-2026-11-24
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate inline JavaScript
        run: node scripts/check-inline-js.mjs
      - name: Install dependencies
        run: npm install
      - name: Run unit and contract tests
        run: npm run test:unit
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Start static app server
        run: |
          npx --yes http-server@14.1.1 . -p 4173 -s > /tmp/friend-ride-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/friend-ride-server.log
          exit 1
      - name: Run browser regression suite
        env:
          FRIEND_RIDE_BASE_URL: http://127.0.0.1:4173/
        run: npm test
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-regression-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
